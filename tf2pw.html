            <h2>
                What is TF2PW?
            </h2>

            <p>
                It's a tool for TF2 (Team Fortress 2) that records who you've played with in the past.<br>
            </p>

            <p>
                <i>It records:</i>
            </p>

            <ul>
                <li>Player Steam IDs</li>
                <li>Player Names</li>
                <li>Times Played With</li>
                <li>Chat Messages</li>
            </ul>

                More recording features will be added in the future.
            </p>
        </body>
